<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f8f5"><meta name="description" content="SALON PROTEIN 15日間チェックシート">
<title>SALON PROTEIN | 15 DAYS CHECK SHEET</title>
<style>
:root{--ink:#4c463e;--sage:#60745f;--sage-dark:#4e624e;--cream:#e7e6de;--line:#c9c6bc;--paper:#faf9f6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman','Yu Mincho','Hiragino Mincho ProN',serif;-webkit-font-smoothing:antialiased}main{max-width:1160px;margin:auto;padding:30px 22px 65px}.brand{font-size:clamp(14px,1.6vw,19px);letter-spacing:.27em}.heading{text-align:center;margin:8px 0 29px;font-size:clamp(27px,5vw,61px);letter-spacing:.13em;font-weight:400;line-height:1.35}.heading em{font-size:1.13em;color:var(--sage);font-style:italic;font-weight:400}.subtitle{text-align:center;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#817e76;font-size:13px;letter-spacing:.08em;margin:-13px 0 30px}.days{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:14px}.day{appearance:none;display:flex;flex-direction:column;overflow:hidden;align-items:stretch;padding:0;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;color:inherit;min-height:158px;box-shadow:0 1px 1px #00000005;transition:transform .15s,border-color .15s}.day:hover{transform:translateY(-2px);border-color:var(--sage)}.day:focus-visible,.reset:focus-visible{outline:3px solid var(--sage);outline-offset:3px}.day-top{background:linear-gradient(130deg,#e9e8e1,#e0e0d7);height:73px;display:flex;align-items:center;justify-content:center;flex-direction:column}.day-label{font-size:13px;letter-spacing:.14em}.day-number{font-size:35px;line-height:1.1}.day-bottom{display:grid;place-items:center;flex:1;min-height:84px}.circle{width:39px;height:39px;border:2px solid var(--sage);border-radius:50%;display:grid;place-items:center;color:white;font:25px/1 Arial,sans-serif}.day[aria-pressed="true"] .circle{background:var(--sage)}.day[aria-pressed="true"] .day-top{background:#dce4d8}.progress{margin:39px auto 0;max-width:680px;text-align:center;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}.progress-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.progress-title{font-size:13px;letter-spacing:.08em}.progress-count{font-size:18px;color:var(--sage-dark);font-weight:600}.bar{margin-top:12px;height:8px;border-radius:99px;background:#e8e7e0;overflow:hidden}.fill{height:100%;width:0;background:var(--sage);transition:width .25s}.progress-note{font-size:12px;color:#77766f;margin-top:13px;line-height:1.7}.actions{text-align:center;margin-top:24px}.reset{border:1px solid #bcbab2;border-radius:30px;padding:10px 21px;background:transparent;color:#68655e;cursor:pointer;font-size:12px;font-family:'Yu Gothic',sans-serif}.reset:hover{background:#eeede8}.complete{color:var(--sage-dark);font-weight:600;margin:13px 0 0;font-size:14px;min-height:22px}@media(max-width:1000px){.days{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:600px){main{padding:25px 16px 44px}.brand{font-size:13px;letter-spacing:.2em}.heading{margin:22px 0 22px;font-size:clamp(26px,7.2vw,40px);letter-spacing:.06em}.subtitle{margin:-9px 0 23px;font-size:11px}.days{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.day{min-height:128px;border-radius:10px}.day-top{height:62px}.day-label{font-size:11px}.day-number{font-size:30px}.day-bottom{min-height:66px}.circle{width:33px;height:33px;font-size:22px}.progress{margin-top:29px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main>
<div class="brand">SALON PROTEIN</div>
<h1 class="heading"><em>15</em> DAYS CHECK SHEET</h1>
<p class="subtitle">飲んだ日の○をタップしてチェック</p>
<section class="days" id="days" aria-label="15日間チェック"></section>
<section class="progress" aria-label="達成状況"><div class="progress-line"><span class="progress-title">15日間の達成状況</span><span class="progress-count" id="count" aria-live="polite">0 / 15 DAYS</span></div><div class="bar" role="progressbar" id="progressbar" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0" aria-label="達成日数"><div class="fill" id="fill"></div></div><p class="complete" id="complete" aria-live="polite"></p><p class="progress-note">チェックはこの端末のブラウザに自動保存されます。<br>別の端末・ブラウザには引き継がれません。</p></section>
<div class="actions"><button class="reset" id="reset" type="button">チェックをリセット</button></div>
</main>
<script>
(()=>{'use strict';const KEY='salon-protein-15days-v1';let checked=[];try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))checked=[...new Set(saved.filter(n=>Number.isInteger(n)&&n>=1&&n<=15))]}catch(e){}const days=document.getElementById('days'),count=document.getElementById('count'),fill=document.getElementById('fill'),bar=document.getElementById('progressbar'),complete=document.getElementById('complete');function save(){try{localStorage.setItem(KEY,JSON.stringify(checked))}catch(e){document.querySelector('.progress-note').textContent='このブラウザでは保存できない場合があります。通常モードでお試しください。'}}function render(){days.innerHTML='';for(let i=1;i<=15;i++){const on=checked.includes(i),button=document.createElement('button');button.type='button';button.className='day';button.setAttribute('aria-pressed',String(on));button.setAttribute('aria-label',`DAY ${i} ${on?'チェック済み':'未チェック'}`);button.innerHTML=`<span class="day-top"><span class="day-label">DAY</span><span class="day-number">${i}</span></span><span class="day-bottom"><span class="circle" aria-hidden="true">${on?'✓':''}</span></span>`;button.addEventListener('click',()=>{checked=on?checked.filter(n=>n!==i):[...checked,i];save();render()});days.appendChild(button)}count.textContent=`${checked.length} / 15 DAYS`;fill.style.width=`${checked.length/15*100}%`;bar.setAttribute('aria-valuenow',checked.length);complete.textContent=checked.length===15?'15日間チャレンジ達成！':''}document.getElementById('reset').addEventListener('click',()=>{if(checked.length&&confirm('15日間のチェック記録をすべてリセットしますか？')){checked=[];save();render()}});render()})();
</script></body></html>
